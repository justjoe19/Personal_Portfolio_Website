<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="slash1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5d8ff" />
      <stop offset="100%" stop-color="#79c0ff" />
    </linearGradient>
    <linearGradient id="slash2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aff5b4" />
      <stop offset="100%" stop-color="#7ee787" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark tile with border -->
  <rect x="1" y="1" width="98" height="98" rx="22" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2" />

  <!-- Dual forward slashes // -->
  <g filter="url(#glow)">
    <!-- Cyan Slash 1 -->
    <polygon points="42.5,23 55,23 36.5,77 24,77" fill="url(#slash1-grad)" />
    <!-- Mint Slash 2 -->
    <polygon points="63.5,23 76,23 57.5,77 45,77" fill="url(#slash2-grad)" />
  </g>
</svg>
