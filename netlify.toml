[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/work"
  to = "/portfolio"
  status = 301

[[redirects]]
  from = "/work/*"
  to = "/portfolio/:splat"
  status = 301

[[redirects]]
  from = "/blog/first-post"
  to = "/blog/custom-website-vs-wordpress-south-bend/"
  status = 301

[[redirects]]
  from = "/blog/first-post/"
  to = "/blog/custom-website-vs-wordpress-south-bend/"
  status = 301

[[redirects]]
  from = "/blog/the-headless-advantage-why-south-bend-businesses-are-rethinking-website-secur"
  to = "/blog/website-security-for-south-bend-businesses/"
  status = 301

[[redirects]]
  from = "/blog/the-headless-advantage-why-south-bend-businesses-are-rethinking-website-secur/"
  to = "/blog/website-security-for-south-bend-businesses/"
  status = 301

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Fingerprinted build assets never change, so browsers can cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
